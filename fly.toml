# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create cocekin_data --size 1 --region ams`, then `fly deploy`.
# SQLite lives on a single volume, so keep exactly one machine.
app = "cocekin"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/cocekin.db"
  TRUST_PROXY = "true"

[[mounts]]
  source = "cocekin_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
